<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>콘텐츠 현황판</title>
<meta name="theme-color" content="#0b0e14">
<style>
  :root{
    --bg:#0b0e14; --card:#141922; --card2:#1a202b; --well:#10141c; --line:#232a37; --line2:#2d3545;
    --text:#edf1f7; --sub:#a3aec2; --dim:#677389; --mute:#4a5468;
    --up:#ff6b6b; --down:#5b8cff; --flat:#8b97ab;
    --accent:#ffd84a; --green:#3fdc8a; --pink:#ff7eb9; --cyan:#4fd6ff; --yt:#ff6464; --violet:#a98bff;
    --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;scroll-padding-top:56px}
  body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
       font-size:14px;line-height:1.45;padding:0 0 48px;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px}
  .num,.tab{font-variant-numeric:tabular-nums}

  /* 머리글 */
  header{padding:20px 2px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  header h1{font-size:23px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
  header .scope{font-size:11.5px;color:var(--dim);margin-top:4px}
  header .upd{text-align:right;flex:none}
  header .upd .k{font-size:10.5px;color:var(--dim);letter-spacing:.3px}
  header .upd .v{font-size:13px;font-weight:700;color:var(--sub);margin-top:2px}
  nav{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
  nav .wrap::-webkit-scrollbar{display:none}
  nav a{flex:none;font-size:12px;font-weight:700;color:var(--sub);text-decoration:none;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}

  #err{display:none;border-radius:12px;padding:11px 13px;font-size:12.5px;margin:12px 0 0;line-height:1.55}
  #err.fallback{display:block;background:#2a2310;border:1px solid #574616;color:#ffe08a}
  #err.fail{display:block;background:#33141c;border:1px solid #66222f;color:#ffb9c2}
  .loading{color:var(--dim);font-size:13px;padding:40px 0;text-align:center}

  /* 구역 */
  .group{margin:28px 2px 10px;display:flex;align-items:baseline;gap:8px}
  .group h2{font-size:16.5px;font-weight:800;letter-spacing:-.3px}
  .group .gsub{font-size:11.5px;color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 14px;margin-bottom:10px}
  .card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-h h3{font-size:15.5px;font-weight:800;letter-spacing:-.3px}
  .handle{font-size:11.5px;color:var(--dim)}
  .chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);color:var(--sub);white-space:nowrap}
  .chip.yt{color:var(--yt)} .chip.ig{color:var(--pink)} .chip.tt{color:var(--cyan)} .chip.th{color:var(--violet)}
  .chip.ok{background:#11301f;border-color:#1d4d33;color:var(--green)}
  .chip.warn{background:#30270f;border-color:#55451a;color:var(--accent)}
  .chip.none{background:#2a1a1f;border-color:#4a2a33;color:#ff9fae}
  .ml{margin-left:auto}
  .src{font-size:10.5px;color:var(--dim);line-height:1.6;margin-top:11px}
  .na{color:var(--mute);font-weight:700}
  .delta{font-size:11.5px;font-weight:800;margin-left:5px}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--flat)}

  /* 핵심 요약 */
  .sumtbl{width:100%;border-collapse:collapse}
  .sumtbl th{font-size:10.5px;color:var(--dim);font-weight:700;text-align:right;padding:0 0 8px;white-space:nowrap}
  .sumtbl th:first-child{text-align:left}
  .sumtbl td{padding:9px 0;border-top:1px solid var(--line);text-align:right;font-size:14px;font-weight:800;white-space:nowrap}
  .sumtbl td:first-child{text-align:left;font-weight:700;font-size:13px;white-space:normal}
  .sumtbl td .d{display:block;font-size:10px;color:var(--dim);font-weight:500;margin-top:1px}
  .sumtbl td .na{font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 11px}
  .kpi .k{font-size:11px;color:var(--sub);font-weight:600}
  .kpi .v{font-size:21px;font-weight:800;letter-spacing:-.6px;margin-top:5px;line-height:1.1}
  .kpi .v small{font-size:12px;color:var(--sub);font-weight:700;margin-left:1px}
  .kpi .d{font-size:10px;color:var(--dim);margin-top:5px;line-height:1.45}

  /* 유튜브 채널 카드 — 전 채널 동일 양식 */
  .yt-card .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  @media(min-width:560px){.yt-card .metrics{grid-template-columns:repeat(4,1fr)}}
  .m{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 11px;min-height:74px}
  .fl{font-size:11px;color:var(--sub);font-weight:600}
  .m .fv{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:4px;line-height:1.15}
  .m .fv small{font-size:11.5px;color:var(--sub);font-weight:700;margin-left:2px}
  .m .fv.na{font-size:15px}
  .m .fd{font-size:10px;color:var(--dim);margin-top:4px}
  .blk{margin-top:12px;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
  .blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
  .blk-h .fd{font-size:10px;color:var(--dim)}
  .vt{width:100%;border-collapse:collapse;table-layout:fixed}
  .vt th{font-size:10px;color:var(--dim);font-weight:600;text-align:right;padding:2px 0 5px}
  .vt th:first-child{text-align:left}
  .vt td{font-size:12.5px;padding:6px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vt td:first-child{text-align:left;padding-right:8px}
  .vt td.na{font-size:11.5px}
  .vt .rk{display:inline-block;width:17px;color:var(--accent);font-weight:800}
  .vt col.c-t{width:auto} .vt col.c-v{width:56px} .vt col.c-l{width:46px} .vt col.c-c{width:40px}
  .spark-box{height:46px;display:flex;align-items:center;justify-content:center;border-radius:8px}
  .spark-box.empty{border:1px dashed var(--line2);font-size:11px;color:var(--mute);font-weight:700}
  svg.sparkline{width:100%;height:46px;display:block}
  .yt-src{font-size:10.5px;color:var(--dim);line-height:1.6;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
  .yt-src .fl{font-size:10.5px;color:var(--sub);margin-right:4px}

  /* 행 목록 (SNS·블로그·프로젝트) */
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:none}
  .row .l{flex:1;min-width:0}
  .row .t{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .row .s{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
  .row .r{text-align:right;flex:none}
  .pair{display:flex;gap:14px;justify-content:flex-end}
  .pair div{text-align:right}
  .pair .k{font-size:10px;color:var(--dim)}
  .pair .v{font-size:15px;font-weight:800;margin-top:1px}
  .pair .v.na{font-size:12px}
  .row .d{font-size:10px;color:var(--dim);margin-top:3px}

  /* 수익 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
  .stat .k{font-size:11px;color:var(--sub);font-weight:600}
  .stat .v{font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
  .line-item{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
  .line-item .k{font-size:12px;color:var(--sub);font-weight:600}
  .line-item .k small{display:block;font-size:10px;color:var(--dim);font-weight:500;margin-top:1px}
  .line-item .v{font-size:15px;font-weight:800;text-align:right}
  .nores{margin-top:12px;border-radius:12px;padding:12px;background:#21151a;border:1px solid #47272f}
  .nores .k{font-size:11px;color:#ff9fae;font-weight:700}
  .nores .v{font-size:15px;font-weight:800;margin-top:3px}
  .ops{margin-top:10px}
  .ops .cap{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px}
  .ops ul{list-style:none}
  .ops li{font-size:12.5px;padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .ops li:first-child{border-top:none}
  .ops li span:last-child{color:var(--dim);font-size:11px;flex:none}

  /* 초대코드 */
  .code{font-size:26px;font-weight:800;letter-spacing:3px;color:var(--accent);margin-top:8px}

  /* 프로젝트 */
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;align-self:flex-start;margin-top:6px}
  .dot.warn{background:var(--accent)}
  .foot{font-size:10.5px;color:var(--dim);line-height:1.75;margin-top:22px;padding:0 2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>콘텐츠 현황판</h1>
      <div class="scope">콘텐츠·수익 채널 통합 · 실측값만 표시</div>
    </div>
    <div class="upd"><div class="k">최종 수집</div><div class="v num" id="updTime">불러오는 중…</div></div>
  </header>
</div>
<nav><div class="wrap">
  <a href="#s-sum">요약</a><a href="#s-yt">유튜브</a><a href="#s-sns">SNS</a><a href="#s-blog">블로그</a><a href="#s-rev">수익</a><a href="#s-inv">초대코드</a><a href="#s-proj">프로젝트</a>
</div></nav>
<div class="wrap">
  <div id="err"></div>
  <div id="app"><div class="loading">지표를 불러오고 있습니다…</div></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwMQhuzThtxDBSK2HPWgS9K06N8syfvotSN0rw-D12BWJrOhr-6vIWHd0iDfWRoiMh8eQ/exec';
const SHEET_ID = '1PTzAlBa7fzncrk1TM80jJFKolvjjiBficXS1fQa-yt4';
const TABS = ['channel_daily','video_daily','blog_daily','project_status','manual_metrics'];

// 유튜브 5채널 — 카드 양식은 전부 YT_FIELDS 하나로 렌더한다 (채널별 분기 없음)
const YT = [
  { id: 'UCmvGKGm4f1Fv4FSa_dREtJg', name: '지잡대TV',     handle: '@지잡대TV',          mm: 'jijabdae' },
  { id: 'UCvjWoQLgLysfLDW-KUdYl3w', name: '스토리스피커', handle: '@storyspeaker_kr',   mm: 'storyspeaker' },
  { id: '@PearlineMae',             name: '새벽바다',     handle: '@PearlineMae',       mm: 'saebyeokbada' },
  { id: 'UC3eTpLaL2U0cQeu1BVmDwwg', name: 'Music Atlas',  handle: '@MusicAtlasOfficial', mm: 'music_atlas' },
  { id: 'UCrIurwPHzIsbq3I2ymFa46w', name: '대광',         handle: '판매 채널',          mm: 'daegwang' }
];
const NA = '미수집';
const M28_VIEWS = '최근 28일 조회수', M28_HOURS = '최근 28일 시청 시간(시간)';

const isNum = v => v !== '' && v !== null && v !== undefined && !isNaN(Number(v));
const fmt = n => isNum(n) ? Number(n).toLocaleString('ko-KR') : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naHtml = () => '<span class="na">' + NA + '</span>';
const md = s => { const m = String(s || '').match(/^\d{4}-(\d{2})-(\d{2})/); return m ? m[1] + '.' + m[2] : ''; };

// ---------- 데이터 통로: GAS 우선 → 실패 시 시트 gviz 폴백 ----------
async function loadFromGas(){
  const r = await fetch(GAS_URL, { redirect:'follow' });
  const d = JSON.parse(await r.text());
  if (!d || !Array.isArray(d.channel_daily)) throw new Error('gas shape');
  return d;
}
function parseGviz(text){
  const m = text.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
  const j = JSON.parse(m[1]);
  const cols = j.table.cols.map(c => c.label);
  return (j.table.rows || []).map(row => {
    const o = {};
    cols.forEach((h, i) => {
      const cell = row.c ? row.c[i] : null;
      if (!cell || cell.v === null || cell.v === undefined) { o[h] = ''; return; }
      let v = cell.v;
      if (typeof v === 'string' && v.startsWith('Date(')) {
        const p = v.slice(5, -1).split(',').map(Number);
        v = p[0] + '-' + String(p[1] + 1).padStart(2, '0') + '-' + String(p[2]).padStart(2, '0');
        if (p[3]) v += ' ' + String(p[3]).padStart(2,'0') + ':' + String(p[4]||0).padStart(2,'0');
      }
      o[h] = v;
    });
    return o;
  }).filter(o => Object.values(o).some(v => v !== ''));
}
async function loadFromSheet(){
  const out = { generated_at: '' };
  for (const tab of TABS) {
    const r = await fetch('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + tab);
    out[tab] = parseGviz(await r.text());
  }
  return out;
}

// ---------- 집계 도우미 ----------
function latestBy(rows, key){
  const map = {};
  rows.forEach(r => { if (r[key] !== '' && (!map[r[key]] || String(r.date) >= String(map[r[key]].date))) map[r[key]] = r; });
  return map;
}
function manualMap(rows){
  const map = {};
  rows.forEach(r => {
    if (!r.project_id || !r.metric) return;
    map[r.project_id] = map[r.project_id] || {};
    const cur = map[r.project_id][r.metric];
    if (!cur || String(r.date) >= String(cur.date)) map[r.project_id][r.metric] = r;
  });
  return map;
}
const mrow = (mm, proj, metric) => (mm[proj] && mm[proj][metric]) || null;
const mval = (mm, proj, metric) => { const r = mrow(mm, proj, metric); return r && r.value !== '' ? r.value : null; };
const mdate = (mm, proj, metric) => { const r = mrow(mm, proj, metric); return r ? String(r.checked_at || r.date || '') : ''; };
// Studio가 '9.2만'처럼 만 단위로 보여 준 값은 그 정밀도 그대로 표기한다
function mHtml(r, unit){
  if (!r || !isNum(r.value)) return null;
  const v = Number(r.value);
  if (/만 단위|반올림/.test(String(r.note || '')) && v >= 10000) return (v / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '<small>만' + (unit ? ' ' + unit : '') + '</small>';
  return fmt(v) + (unit ? '<small>' + unit + '</small>' : '');
}

function subsSeries(rows, chId){
  return rows.filter(r => r.channel_id === chId && isNum(r.subscribers))
             .slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));
}
function deltaHtml(series){
  if (series.length < 2) return '';
  const d = Number(series[series.length-1].subscribers) - Number(series[series.length-2].subscribers);
  if (d > 0) return '<span class="delta up">▲' + d + '</span>';
  if (d < 0) return '<span class="delta down">▼' + Math.abs(d) + '</span>';
  return '<span class="delta flat">±0</span>';
}
function sparkHtml(series){
  const rs = series.slice(-30);
  if (rs.length < 2) return '<div class="spark-box empty">' + NA + ' · 실측 ' + rs.length + '회 (2회부터 표시)</div>';
  const vals = rs.map(r => Number(r.subscribers));
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const W = 300, H = 46, P = 5;
  const xy = vals.map((v, i) => [P + (W - 2*P) * i / (vals.length - 1), H - P - (H - 2*P) * (v - min) / span]);
  const pts = xy.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const last = xy[xy.length - 1];
  return '<svg class="sparkline" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<polyline points="' + pts + '" fill="none" stroke="#ffd84a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="#ffd84a"/></svg>';
}
// 최신 스냅샷 기준: 조회수 실측 영상은 조회수 순, 조회수 없는 영상은 최근 게시순, 빈 자리는 미수집 슬롯
function top3Rows(videos, chId){
  const own = videos.filter(v => v.channel_id === chId);
  const dates = [...new Set(own.map(v => String(v.date)))].sort();
  if (!dates.length) return { date: '', rows: [null, null, null] };
  const latest = dates[dates.length - 1];
  const snap = own.filter(v => String(v.date) === latest);
  const withViews = snap.filter(v => isNum(v.views)).sort((a, b) => Number(b.views) - Number(a.views));
  const noViews = snap.filter(v => !isNum(v.views)).sort((a, b) => String(b.published_at).localeCompare(String(a.published_at)));
  const rows = withViews.concat(noViews).slice(0, 3);
  while (rows.length < 3) rows.push(null);
  return { date: latest, rows };
}

// ---------- 유튜브 채널 카드 ----------
// 공통 필드셋: 순서·라벨·레이아웃 고정. 값이 없으면 필드를 빼지 않고 '미수집'으로 채운다.
const YT_FIELDS = ['구독자', '영상 수', '최근 28일 조회수', '28일 시청 시간', '최근 영상 TOP3', '구독자 추이', '출처·기준일'];

function metricBox(label, valueHtml, dateText){
  return '<div class="m" data-field="' + esc(label) + '"><div class="fl">' + esc(label) + '</div>' +
    '<div class="fv num' + (valueHtml === null ? ' na' : '') + '">' + (valueHtml === null ? NA : valueHtml) + '</div>' +
    '<div class="fd">' + (valueHtml === null ? '실측 기록 없음' : esc(dateText) + ' 기준') + '</div></div>';
}
function ytCard(d, ch, mm){
  const latest = latestBy(d.channel_daily, 'channel_id')[ch.id] || null;
  const series = subsSeries(d.channel_daily, ch.id);
  const subsRow = series.length ? series[series.length - 1] : null;
  const vcRow = d.channel_daily.filter(r => r.channel_id === ch.id && isNum(r.video_count))
                 .sort((a,b) => String(a.date).localeCompare(String(b.date))).pop() || null;
  const v28 = mrow(mm, ch.mm, M28_VIEWS), h28 = mrow(mm, ch.mm, M28_HOURS);
  const top = top3Rows(d.video_daily, ch.id);

  let h = '<article class="card yt-card" data-ch="' + esc(ch.id) + '">' +
    '<div class="card-h"><h3>' + esc(ch.name) + '</h3><span class="handle">' + esc(ch.handle) + '</span><span class="chip yt ml">YouTube</span></div>' +
    '<div class="metrics">' +
      metricBox(YT_FIELDS[0], subsRow ? fmt(subsRow.subscribers) + '<small>명</small>' + deltaHtml(series) : null, subsRow && subsRow.date) +
      metricBox(YT_FIELDS[1], vcRow ? fmt(vcRow.video_count) + '<small>편</small>' : null, vcRow && vcRow.date) +
      metricBox(YT_FIELDS[2], mHtml(v28, '회'), mdate(mm, ch.mm, M28_VIEWS)) +
      metricBox(YT_FIELDS[3], mHtml(h28, '시간'), mdate(mm, ch.mm, M28_HOURS)) +
    '</div>';

  h += '<div class="blk" data-field="' + YT_FIELDS[4] + '"><div class="blk-h"><span class="fl">' + YT_FIELDS[4] + '</span>' +
       '<span class="fd">' + (top.date ? esc(top.date) + ' 스냅샷 · 조회수 순' : '실측 기록 없음') + '</span></div>' +
       '<table class="vt"><colgroup><col class="c-t"><col class="c-v"><col class="c-l"><col class="c-c"></colgroup>' +
       '<thead><tr><th>제목</th><th>조회수</th><th>좋아요</th><th>댓글</th></tr></thead><tbody>' +
       top.rows.map((v, i) => {
         const cell = x => isNum(x) ? '<td class="num">' + fmt(x) + '</td>' : '<td class="na">' + NA + '</td>';
         if (!v) return '<tr><td><span class="rk">' + (i+1) + '</span><span class="na">' + NA + '</span></td><td class="na">' + NA + '</td><td class="na">' + NA + '</td><td class="na">' + NA + '</td></tr>';
         return '<tr><td title="' + esc(v.title) + '"><span class="rk">' + (i+1) + '</span>' + esc(v.title) + '</td>' + cell(v.views) + cell(v.likes) + cell(v.comments) + '</tr>';
       }).join('') + '</tbody></table></div>';

  h += '<div class="blk" data-field="' + YT_FIELDS[5] + '"><div class="blk-h"><span class="fl">' + YT_FIELDS[5] + '</span>' +
       '<span class="fd">' + (series.length >= 2 ? '최근 ' + Math.min(series.length, 30) + '회 실측' : '') + '</span></div>' + sparkHtml(series) + '</div>';

  h += '<div class="yt-src" data-field="' + YT_FIELDS[6] + '"><span class="fl">' + YT_FIELDS[6] + '</span>' +
       (latest ? esc(latest.source || NA) + ' · 기준일 ' + esc(latest.date) : NA) +
       (v28 || h28 ? ' · 28일 지표 ' + esc((v28 || h28).note || '') : '') + '</div></article>';
  return h;
}
