<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>콘텐츠 현황판</title>
<meta name="theme-color" content="#0b0e14">
<style>
:root{color-scheme:dark;--bg:#0c1015;--card:#151c24;--well:#10161d;--line:#303d4c;--text:#f3f6fa;--sub:#bdc8d6;--accent:#c4ed91;--up:#c4ed91;--down:#ffaba5;--r:20px}

*{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}

html{scroll-behavior:smooth;scroll-padding-top:90px}

body{margin:0;background:var(--bg);color:var(--text);font-size:16px;line-height:1.65;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}

a{color:inherit;text-underline-offset:5px;text-decoration-color:#839b70}
a[target]{display:inline-block;white-space:nowrap}
a[target]::after{content:" ↗";color:var(--accent);font-size:.75em;white-space:nowrap}
a:hover{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}

h1,h2,h3,p{margin:0}
 .wrap{max-width:1240px;margin:auto;padding:0 32px}
header{padding:44px 0 30px;display:flex;justify-content:space-between;gap:24px;align-items:end}
h1{font-size:34px;line-height:1.25;letter-spacing:-1.2px}
.scope{color:var(--sub);margin-top:10px}
.upd{max-width:320px;text-align:right}
.upd .k{color:var(--accent);font-size:13px}
.upd .v{margin-top:5px;font-size:15px;overflow-wrap:anywhere}

nav{position:sticky;top:0;z-index:5;background:#0c1015;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px}
nav a{flex:none;padding:7px 13px;text-decoration:none;font-size:14px;color:var(--sub);border-radius:8px}
nav a:hover{background:var(--card)}

.group{display:flex;align-items:baseline;gap:16px;margin:48px 0 18px}
.group h2{font-size:24px;letter-spacing:-.6px}
.gsub{font-size:14px;color:var(--sub)}
.card{padding:24px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;min-width:0}
.channel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.channel-grid>.card{margin:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:23px;letter-spacing:-.5px}
.handle{font-size:13px;color:var(--sub)}
.chip{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;color:var(--sub)}
.ml{margin-left:auto}
.src,.yt-src,.fd,.d{font-size:12px;color:var(--sub);line-height:1.65;overflow-wrap:anywhere}
.src,.yt-src{margin-top:18px}
.yt-src{padding-top:15px;border-top:1px solid var(--line)}
.na{color:var(--sub);font-size:16px;font-weight:500}
.num,.v,.fv{font-variant-numeric:tabular-nums}
.gnote{color:var(--sub);border-left:3px solid var(--accent);padding:10px 16px;margin-bottom:20px;background:var(--well);font-size:14px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}
.m{padding:15px;background:var(--well);border:1px solid var(--line);border-radius:12px;min-width:0}
.m:first-child{grid-column:1/-1;border-color:#6b8656;padding:20px}
.fl,.k{font-size:14px;color:var(--sub)}
.fv{font-size:26px;font-weight:750;line-height:1.4;margin:7px 0;overflow-wrap:anywhere}
.m:first-child .fv{font-size:44px;color:var(--accent);letter-spacing:-1.2px}
small{font-size:14px;font-weight:500;margin-left:4px;color:var(--sub)}
.delta{font-size:14px;margin-left:10px;letter-spacing:0}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--sub)}
.blk{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.blk-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.blk-h .fl{color:var(--text);font-weight:650}

table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;color:var(--sub);font-weight:500}
td,th{text-align:right;padding:12px 4px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
td:first-child,th:first-child{text-align:left}
td{font-size:15px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sumtbl{min-width:480px}
.sumtbl th:first-child{width:30%}
.sumtbl td:not(:first-child),.sumtbl .d,.vt td:not(:first-child){white-space:nowrap}
.table-scroll .vt{min-width:380px}
.sumtbl td{font-size:20px;font-weight:650}
.sumtbl td:first-child{font-size:17px}
.sumtbl td .d{display:block;font-weight:400;margin-top:5px}
.c-t{width:46%}
.c-v,.c-l,.c-c{width:18%}
.vt td:first-child{font-size:14px;word-break:break-word;padding-right:10px}
.vt .na{font-size:13px}
.rk{color:var(--accent);margin-right:7px}
.spark-box{padding:15px;border:1px dashed var(--line);border-radius:10px;color:var(--sub);font-size:13px}
.sparkline{width:100%;height:62px;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.kpi{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0}
.kpi .v{font-size:30px;font-weight:750;margin:10px 0}
.row{display:flex;align-items:center;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.row:first-child{padding-top:0}
.row:last-child{padding-bottom:0;border-bottom:0}
.l{flex:1;min-width:0}
.t{font-size:18px;font-weight:650}
.s{font-size:14px;color:var(--sub);margin-top:6px;overflow-wrap:anywhere}
.r{text-align:right;min-width:0}
.pair{display:flex;justify-content:flex-end;gap:26px}
.pair .v{font-size:24px;font-weight:700}
.pair .v.na{font-size:16px}
.r .d{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.stat{padding:16px;background:var(--well);border:1px solid var(--line);border-radius:12px;min-width:0}
.stat .v{font-size:28px;font-weight:750;margin-top:8px;overflow-wrap:anywhere}
.line-item{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px;margin-top:14px;border:1px solid var(--line);border-radius:12px}
.line-item small{display:block;margin:5px 0 0}
.line-item .v{font-size:26px;font-weight:700;overflow-wrap:anywhere}
.nores{padding:20px;margin-top:22px;border:1px solid var(--line);border-radius:12px}
.nores .v{margin-top:8px;font-size:19px}
.ops{margin-top:24px}
.cap{color:var(--sub);font-size:14px}
.ops ul{list-style:none;padding:0;margin:8px 0 0}
.ops li{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.ops li span:last-child{color:var(--sub);overflow-wrap:anywhere}
.code{font-size:38px;letter-spacing:5px;color:var(--accent);font-weight:750;margin-top:18px}
.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;flex:none}
.dot.warn{background:#ffd18a}
.foot{font-size:13px;color:var(--sub);padding:32px 0 48px;margin-top:24px;border-top:1px solid var(--line)}
#err{display:none}
#err.fallback,#err.fail{display:block;padding:18px;border:1px solid #987c4f;background:#282219;color:#ffe2ad;border-radius:12px;margin-top:24px}
.loading{padding:64px 0;color:var(--sub)}

@media(max-width:760px){.wrap{padding:0 18px}
header{padding:28px 0 22px;display:block}
h1{font-size:29px}
.scope{font-size:14px}
.upd{text-align:left;margin-top:20px;max-width:none}
.upd .k,.upd .v{display:inline;margin-right:8px;font-size:12px}
.group{margin-top:36px;gap:12px;flex-wrap:wrap}
.group h2{font-size:22px}
.gsub{font-size:13px}
.channel-grid{grid-template-columns:minmax(0,1fr);gap:18px}
.card{padding:20px}
.card-h h3{font-size:22px}
.handle{order:3;width:100%}
.metrics{gap:10px}
.m{padding:12px}
.fv{font-size:25px}
.fd{font-size:12px}
.sumtbl td{font-size:16px;padding:14px 2px}
.sumtbl td:first-child{font-size:14px}
.sumtbl .d{font-size:11px}
.sumtbl th{font-size:11px}
.sumtbl th:first-child{width:30%}
.kpis{grid-template-columns:1fr;gap:10px}
.kpi{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:16px}
.kpi .v{margin:0;font-size:26px}
.kpi .d{grid-column:1/-1}
.row{align-items:stretch;flex-direction:column;gap:14px}
.r{text-align:left}
.pair{justify-content:flex-start;gap:36px}
.stats{grid-template-columns:1fr}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px}
.stat>.d{grid-column:1/-1}
.stat .v{margin:0;font-size:26px}
.line-item{align-items:flex-start;flex-direction:column;gap:12px}
.ops li{flex-direction:column;gap:6px}
.vt td{font-size:13px}
.vt td:first-child{font-size:14px}
.vt th{font-size:11px}
}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>콘텐츠 현황판</h1>
      <div class="scope">콘텐츠·수익 채널 통합 · 실측값만 표시</div>
    </div>
    <div class="upd"><div class="k">최종 수집</div><div class="v num" id="updTime">불러오는 중…</div></div>
  </header>
</div>
<nav><div class="wrap">
  <a href="#s-sum">요약</a><a href="#s-yt">유튜브</a><a href="#s-ytvid">영상별 실측</a><a href="#s-sns">SNS</a><a href="#s-blog">블로그</a><a href="#s-rev">수익</a><a href="#s-inv">초대코드</a><a href="#s-proj">프로젝트</a>
</div></nav>
<div class="wrap">
  <div id="err" role="status" aria-live="polite"></div>
  <main id="app"><div class="loading">지표를 불러오고 있습니다…</div></main>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwMQhuzThtxDBSK2HPWgS9K06N8syfvotSN0rw-D12BWJrOhr-6vIWHd0iDfWRoiMh8eQ/exec';
const SHEET_ID = '1PTzAlBa7fzncrk1TM80jJFKolvjjiBficXS1fQa-yt4';
const TABS = ['channel_daily','video_daily','blog_daily','project_status','manual_metrics'];

// 유튜브 4채널 — 카드 양식은 전부 YT_FIELDS 하나로 렌더한다 (채널별 분기 없음)
const YT = [
  { id: 'UCmvGKGm4f1Fv4FSa_dREtJg', name: '지잡대TV',     handle: '@지잡대TV',          mm: 'jijabdae' },
  { id: 'UCvjWoQLgLysfLDW-KUdYl3w', name: '스토리스피커', handle: '@storyspeaker_kr',   mm: 'storyspeaker' },
  { id: 'UCrIurwPHzIsbq3I2ymFa46w', name: '새벽바다',     handle: '@PearlineMae',       mm: 'saebyeokbada' },
  { id: 'UC3eTpLaL2U0cQeu1BVmDwwg', name: 'Music Atlas',  handle: '@MusicAtlasOfficial', mm: 'music_atlas' }
];
const link = (name, url) => '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(name) + '</a>';
const ytLink = ch => link(ch.name, 'https://www.youtube.com/channel/' + ch.id);
const NA = '미수집';
const M28_VIEWS = '최근 28일 조회수', M28_HOURS = '최근 28일 시청 시간(시간)';
const M_MONTHLY = '월간 시청자(명)', M_KR = '시청자 지역 대한민국(%)', M_48H = '실시간 48시간 조회수';

const isNum = v => v !== '' && v !== null && v !== undefined && typeof v !== 'boolean' && String(v).trim() !== '' && Number.isFinite(Number(v));
const fmt = n => isNum(n) ? Number(n).toLocaleString('ko-KR') : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const provenance = (r, source) => esc(source) + ' · ' + (r ? esc(r.checked_at || r.date || r.updated_at || NA) + ' 기준' : '실측 기록 없음');
const shortDate = value => { const m = String(value || '').match(/^\d{4}-(\d{2})-(\d{2})/); return m ? m[1] + '-' + m[2] : NA; };
const naHtml = () => '<span class="na">' + NA + '</span>';

// ---------- 데이터 통로: GAS 우선 → 실패 시 시트 gviz 폴백 ----------
async function loadFromGas(){
  const r = await fetch(GAS_URL, { redirect:'follow', signal:AbortSignal.timeout(15000) });
  const d = JSON.parse(await r.text());
  if (!r.ok || !d || !TABS.every(tab => Array.isArray(d[tab]))) throw new Error('gas shape');
  return d;
}
function parseGviz(text){
  const m = text.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
  const j = JSON.parse(m[1]);
  const cols = j.table.cols.map(c => c.label);
  return (j.table.rows || []).map(row => {
    const o = {};
    cols.forEach((h, i) => {
      const cell = row.c ? row.c[i] : null;
      if (!cell || cell.v === null || cell.v === undefined) { o[h] = ''; return; }
      let v = cell.v;
      if (typeof v === 'string' && v.startsWith('Date(')) {
        const p = v.slice(5, -1).split(',').map(Number);
        v = p[0] + '-' + String(p[1] + 1).padStart(2, '0') + '-' + String(p[2]).padStart(2, '0');
        if (p[3]) v += ' ' + String(p[3]).padStart(2,'0') + ':' + String(p[4]||0).padStart(2,'0');
      }
      o[h] = v;
    });
    return o;
  }).filter(o => Object.values(o).some(v => v !== ''));
}
async function loadFromSheet(){
  const out = { generated_at: '' };
  for (const tab of TABS) {
    const r = await fetch('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + tab, {signal:AbortSignal.timeout(15000)});
    if (!r.ok) throw new Error('sheet response');
    out[tab] = parseGviz(await r.text());
  }
  return out;
}

// ---------- 집계 도우미 ----------
function latestBy(rows, key){
  const map = {};
  rows.forEach(r => { if (r[key] !== '' && (!map[r[key]] || String(r.date) >= String(map[r[key]].date))) map[r[key]] = r; });
  return map;
}
function manualMap(rows){
  const map = {};
  rows.forEach(r => {
    if (!r.project_id || !r.metric) return;
    map[r.project_id] = map[r.project_id] || {};
    const cur = map[r.project_id][r.metric];
    if (!cur || String(r.date) >= String(cur.date)) map[r.project_id][r.metric] = r;
  });
  return map;
}
const mrow = (mm, proj, metric) => (mm[proj] && mm[proj][metric]) || null;
const mdate = (mm, proj, metric) => { const r = mrow(mm, proj, metric); return r ? String(r.checked_at || r.date || '') : ''; };
// Studio가 '9.2만'처럼 만 단위로 보여 준 값은 그 정밀도 그대로 표기한다
function mHtml(r, unit){
  if (!r || !isNum(r.value)) return null;
  const v = Number(r.value);
  if (/만 단위|반올림/.test(String(r.note || '')) && v >= 10000) return (v / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '<small>만' + (unit ? ' ' + unit : '') + '</small>';
  return fmt(v) + (unit ? '<small>' + unit + '</small>' : '');
}

function subsSeries(rows, chId){
  return rows.filter(r => r.channel_id === chId && isNum(r.subscribers))
             .slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));
}
function deltaHtml(series){
  if (series.length < 2) return '';
  const d = Number(series[series.length-1].subscribers) - Number(series[series.length-2].subscribers);
  if (d > 0) return '<span class="delta up">▲' + d + '</span>';
  if (d < 0) return '<span class="delta down">▼' + Math.abs(d) + '</span>';
  return '<span class="delta flat">±0</span>';
}
function sparkHtml(series){
  const rs = series.slice(-30);
  if (rs.length < 2) return '<div class="spark-box empty">' + NA + ' · 실측 ' + rs.length + '회 (2회부터 표시)</div>';
  const vals = rs.map(r => Number(r.subscribers));
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const W = 300, H = 46, P = 5;
  const xy = vals.map((v, i) => [P + (W - 2*P) * i / (vals.length - 1), H - P - (H - 2*P) * (v - min) / span]);
  const pts = xy.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const last = xy[xy.length - 1];
  return '<svg class="sparkline" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<polyline points="' + pts + '" fill="none" stroke="#c4ed91" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="#c4ed91"/></svg>';
}
// 최신 스냅샷 기준: 조회수 실측 영상은 조회수 순, 조회수 없는 영상은 최근 게시순, 빈 자리는 미수집 슬롯
function top3Rows(videos, chId){
  const own = videos.filter(v => v.channel_id === chId);
  const dates = [...new Set(own.map(v => String(v.date)))].sort();
  if (!dates.length) return { date: '', rows: [null, null, null] };
  const latest = dates[dates.length - 1];
  const snap = own.filter(v => String(v.date) === latest);
  const withViews = snap.filter(v => isNum(v.views)).sort((a, b) => Number(b.views) - Number(a.views));
  const noViews = snap.filter(v => !isNum(v.views)).sort((a, b) => String(b.published_at).localeCompare(String(a.published_at)));
  const rows = withViews.concat(noViews).slice(0, 3);
  while (rows.length < 3) rows.push(null);
  return { date: latest, rows };
}

// 채널 최신 스냅샷의 조회수 실측 영상 전체 (조회수 내림차순)
function channelVideos(videos, chId){
  const t = videos.filter(v => v.channel_id === chId);
  const dt = t.map(v => String(v.date)).sort().pop();
  return t.filter(v => String(v.date) === dt).sort((a,b) => (isNum(b.views) ? Number(b.views) : -1) - (isNum(a.views) ? Number(a.views) : -1));
}
const VT_HEAD = '<colgroup><col class="c-t"><col class="c-v"><col class="c-l"><col class="c-c"></colgroup><thead><tr><th>제목</th><th>조회수</th><th>좋아요</th><th>댓글</th></tr></thead>';
const vtCell = x => isNum(x) ? '<td class="num">' + fmt(x) + '</td>' : '<td class="na">' + NA + '</td>';

// ---------- 유튜브 채널 카드 ----------
// 공통 필드셋: 순서·라벨·레이아웃 고정. 값이 없으면 필드를 빼지 않고 '미수집'으로 채운다.
const YT_FIELDS = ['구독자', '영상 수', '최근 28일 조회수', '28일 시청 시간', '월간 시청자', '시청자 한국 비중', '최근 48시간 조회수', '최근 영상 TOP3', '구독자 추이', '출처·기준일'];

function metricBox(label, valueHtml, dateText, source){
  return '<div class="m" data-field="' + esc(label) + '"><div class="fl">' + esc(label) + '</div>' +
    '<div class="fv num' + (valueHtml === null ? ' na' : '') + '">' + (valueHtml === null ? NA : valueHtml) + '</div>' +
    '<div class="fd">' + (valueHtml === null ? '실측 기록 없음' : esc(dateText) + ' 기준 · ' + esc(source || 'manual_metrics')) + '</div></div>';
}
function ytCard(d, ch, mm){
  const latest = latestBy(d.channel_daily, 'channel_id')[ch.id] || null;
  const series = subsSeries(d.channel_daily, ch.id);
  const subsRow = series.length ? series[series.length - 1] : null;
  const vcRow = d.channel_daily.filter(r => r.channel_id === ch.id && isNum(r.video_count))
                 .sort((a,b) => String(a.date).localeCompare(String(b.date))).pop() || null;
  const v28 = mrow(mm, ch.mm, M28_VIEWS), h28 = mrow(mm, ch.mm, M28_HOURS);
  const mon = mrow(mm, ch.mm, M_MONTHLY), kr = mrow(mm, ch.mm, M_KR), h48 = mrow(mm, ch.mm, M_48H);
  const top = top3Rows(d.video_daily, ch.id);

  let h = '<article class="card yt-card" data-ch="' + esc(ch.id) + '">' +
    '<div class="card-h"><h3>' + ytLink(ch) + '</h3><span class="handle">' + esc(ch.handle) + '</span><span class="chip yt ml">YouTube</span></div>' +
    '<div class="metrics">' +
      metricBox(YT_FIELDS[0], subsRow ? fmt(subsRow.subscribers) + '<small>명</small>' + deltaHtml(series) : null, subsRow && subsRow.date, subsRow && (subsRow.source || 'channel_daily')) +
      metricBox(YT_FIELDS[1], vcRow ? fmt(vcRow.video_count) + '<small>편</small>' : null, vcRow && vcRow.date, vcRow && (vcRow.source || 'channel_daily')) +
      metricBox(YT_FIELDS[2], mHtml(v28, '회'), mdate(mm, ch.mm, M28_VIEWS)) +
      metricBox(YT_FIELDS[3], mHtml(h28, '시간'), mdate(mm, ch.mm, M28_HOURS)) +
      metricBox(YT_FIELDS[4], mHtml(mon, '명'), mdate(mm, ch.mm, M_MONTHLY)) +
      metricBox(YT_FIELDS[5], kr && isNum(kr.value) ? Number(kr.value) + '<small>%</small>' : null, mdate(mm, ch.mm, M_KR)) +
      metricBox(YT_FIELDS[6], mHtml(h48, '회'), mdate(mm, ch.mm, M_48H)) +
    '</div>';

  h += '<div class="blk" data-field="' + YT_FIELDS[7] + '"><div class="blk-h"><span class="fl">' + YT_FIELDS[7] + '</span>' +
       '<span class="fd">' + (top.date ? esc(top.date) + ' · video_daily · 조회수 순' : '실측 기록 없음') + '</span></div>' +
       '<div class="table-scroll" tabindex="0" role="region" aria-label="영상 실측 표 (가로 스크롤)"><table class="vt">' + VT_HEAD + '<tbody>' +
       top.rows.map((v, i) => {
         if (!v) return '<tr><td><span class="rk">' + (i+1) + '</span><span class="na">' + NA + '</span></td><td class="na">' + NA + '</td><td class="na">' + NA + '</td><td class="na">' + NA + '</td></tr>';
         return '<tr><td title="' + esc(v.title) + '"><span class="rk">' + (i+1) + '</span>' + esc(v.title) + '</td>' + vtCell(v.views) + vtCell(v.likes) + vtCell(v.comments) + '</tr>';
       }).join('') + '</tbody></table></div></div>';

  h += '<div class="blk" data-field="' + YT_FIELDS[8] + '"><div class="blk-h"><span class="fl">' + YT_FIELDS[8] + '</span>' +
       '<span class="fd">' + (series.length >= 2 ? '최근 ' + Math.min(series.length, 30) + '회 · channel_daily · ' + esc(series[0].date) + ' ~ ' + esc(series[series.length-1].date) : '') + '</span></div>' + sparkHtml(series) + '</div>';

  h += '<div class="yt-src" data-field="' + YT_FIELDS[9] + '"><span class="fl">' + YT_FIELDS[9] + '</span>' +
       (latest ? esc(latest.source || NA) + ' · 기준일 ' + esc(latest.date) : NA) +
       (v28 || h28 ? ' · 28일 지표 ' + esc((v28 || h28).note || '') : '') + '</div></article>';
  return h;
}

    }
    el.className = 'fallback';
    el.textContent = 'GAS 연결에 실패해 구글시트 직접 읽기로 표시 중입니다.';
  }
  render(d);
})();
</script>
</body>
