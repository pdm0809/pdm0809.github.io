<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>콘텐츠 현황판</title>
<meta name="theme-color" content="#0b0e14">
<style>
:root{color-scheme:dark;--bg:#0c1015;--card:#151c24;--well:#10161d;--line:#303d4c;--text:#f3f6fa;--sub:#bdc8d6;--accent:#c4ed91;--up:#c4ed91;--down:#ffaba5;--r:20px}

*{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}

html{scroll-behavior:smooth;scroll-padding-top:70px}

body{margin:0;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}

a{color:inherit;text-underline-offset:5px;text-decoration-color:#839b70}
a[target]{overflow-wrap:anywhere}
a[target]::after{content:" ↗";color:var(--accent);font-size:.75em;white-space:nowrap}
a:hover{color:var(--accent)}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}

h1,h2,h3,p{margin:0}
.wrap{max-width:1240px;margin:auto;padding:0 32px}
header{padding:44px 0 30px;display:flex;justify-content:space-between;gap:24px;align-items:end}
h1{font-size:34px;line-height:1.25;letter-spacing:-1.2px}
.scope{color:var(--sub);margin-top:10px}
.upd{max-width:320px;text-align:right}
.upd .k{color:var(--accent);font-size:13px}
.upd .v{margin-top:5px;font-size:15px;overflow-wrap:anywhere}

nav{position:sticky;top:0;z-index:5;background:#0c1015;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
nav a{flex:none;padding:7px 12px;text-decoration:none;font-size:14px;color:var(--sub);border-radius:8px}
nav a:hover{background:var(--card)}

.group{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;margin:48px 0 18px}
.group h2{font-size:24px;letter-spacing:-.6px}
.gsub{font-size:14px;color:var(--sub)}
.gnote{color:var(--sub);border-left:3px solid var(--accent);padding:10px 16px;margin-bottom:20px;background:var(--well);font-size:14px;overflow-wrap:anywhere}

.grid2,.grid3,.kpis{display:grid;gap:18px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid2+.grid2,.grid2+.card,.grid2+.src{margin-top:18px}
.card{padding:24px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.card-h h3{font-size:22px;letter-spacing:-.5px;min-width:0;overflow-wrap:anywhere}
.handle{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.chip{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;color:var(--sub)}
.chip.warn{border-color:#987c4f;color:#ffe2ad}
.chip.ok{border-color:#6b8656;color:var(--accent)}
.ml{margin-left:auto}

.k{font-size:14px;color:var(--sub)}
.src,.fd,.d{font-size:12px;color:var(--sub);line-height:1.6;overflow-wrap:anywhere}
.src{margin-top:18px}
.card-src{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.na{color:var(--sub);font-size:16px;font-weight:500;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
small{font-size:14px;font-weight:500;margin-left:4px;color:var(--sub);letter-spacing:0}
.delta{font-size:14px;margin-left:10px;letter-spacing:0;white-space:nowrap}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--sub)}

/* 큰 숫자 */
.kpi{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0}
.hv{font-size:32px;font-weight:750;line-height:1.25;margin:6px 0;letter-spacing:-.8px;overflow-wrap:anywhere}
.kpi .hv{font-size:36px}
.heroes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.hero{padding:16px;background:var(--well);border:1px solid var(--line);border-radius:14px;min-width:0}
.hero.main{grid-column:1/-1;border-color:#6b8656;padding:20px}
.hero.main .hv{font-size:44px;color:var(--accent);letter-spacing:-1.2px}
.aux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.ax{padding:13px;border:1px solid var(--line);border-radius:12px;min-width:0}
.av{font-size:24px;font-weight:700;line-height:1.3;margin:4px 0;overflow-wrap:anywhere}

/* 펼치기 */
details.fold{margin-top:16px;border-top:1px solid var(--line)}
details>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:14px 0}
details>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--accent);margin-right:-4px}
details.fold[open]>summary::before{content:"▾"}
.st{font-weight:650}
details.more>summary{padding:12px 0 4px;color:var(--accent);font-size:14px}
details.more[open]>summary{display:none}
.list{list-style:none;padding:0;margin:0}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.li .delta{margin-left:0}
.li .v{font-weight:650;text-align:right}
.vid{padding:12px 0;border-top:1px solid var(--line)}
.vid .tt{font-size:15px;overflow-wrap:anywhere}
.vm{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:4px;font-size:13px;color:var(--sub)}
.vm b{color:var(--text);font-weight:650;font-size:15px}
.vm .na{font-size:13px}
.spark-box{padding:15px;border:1px dashed var(--line);border-radius:10px;color:var(--sub);font-size:13px;margin-bottom:8px}
.sparkline{width:100%;height:62px;display:block;margin-bottom:8px}

/* 상태·수익·초대 */
.badge{display:inline-flex;align-items:center;gap:7px;max-width:100%;font-size:13px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;overflow-wrap:anywhere}
.badge.warn{border-color:#987c4f;color:#ffe2ad}
.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;flex:none}
.dot.warn{background:#ffd18a}
.desc{margin-top:12px;font-size:15px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin-top:12px;font-size:14px}
.kv dt{color:var(--sub)}
.kv dd{margin:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{padding:16px;background:var(--well);border:1px solid var(--line);border-radius:12px;min-width:0}
.stat .hv{font-size:28px}
.line-item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 20px;align-items:center;padding:18px;margin-top:14px;border:1px solid var(--line);border-radius:12px}
.line-item>*{min-width:0}
.line-item small{display:block;margin:5px 0 0}
.nores{padding:20px;margin-top:20px;border:1px solid var(--line);border-radius:12px}
.nores .v{margin-top:8px;font-size:19px;overflow-wrap:anywhere}
.code{font-size:44px;letter-spacing:5px;color:var(--accent);font-weight:750;margin-top:16px;overflow-wrap:anywhere}

.foot{font-size:13px;color:var(--sub);padding:32px 0 48px;margin-top:40px;border-top:1px solid var(--line)}
#err{display:none}
#err.fallback,#err.fail{display:block;padding:18px;border:1px solid #987c4f;background:#282219;color:#ffe2ad;border-radius:12px;margin-top:24px}
.loading{padding:64px 0;color:var(--sub)}

@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){.wrap{padding:0 18px}
header{padding:28px 0 22px;display:block}
h1{font-size:29px}
.scope{font-size:14px}
.upd{text-align:left;margin-top:20px;max-width:none}
.upd .k,.upd .v{display:inline;margin-right:8px;font-size:12px}
.group{margin-top:36px}
.group h2{font-size:22px}
.gsub{font-size:13px}
.grid2,.grid3{grid-template-columns:minmax(0,1fr);gap:16px}
.grid2+.grid2,.grid2+.card,.grid2+.src{margin-top:16px}
.kpis{gap:10px}
.kpi{padding:14px}
.kpi .hv{font-size:28px;letter-spacing:-.6px}
.card{padding:18px}
.card-h h3{font-size:21px}
.hero{padding:12px}
.hero.main{padding:16px}
.hero.main .hv{font-size:40px}
.ax{padding:11px}
.stats{grid-template-columns:minmax(0,1fr)}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px}
.stat>.d{grid-column:1/-1}
.stat .hv{margin:0;font-size:26px}
.line-item{align-items:flex-start;flex-direction:column}
.code{font-size:38px}
}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>콘텐츠 현황판</h1>
      <div class="scope">콘텐츠·수익 채널 통합 · 실측값만 표시</div>
    </div>
    <div class="upd"><div class="k">최종 수집</div><div class="v num" id="updTime">불러오는 중…</div></div>
  </header>
</div>
<nav><div class="wrap">
  <a href="#s-sum">요약</a><a href="#s-yt">유튜브</a><a href="#s-blog">블로그</a><a href="#s-sns">SNS</a><a href="#s-rev">수익</a><a href="#s-inv">초대코드</a><a href="#s-proj">프로젝트</a>
</div></nav>
<div class="wrap">
  <div id="err" role="status" aria-live="polite"></div>
  <main id="app"><div class="loading">지표를 불러오고 있습니다…</div></main>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwMQhuzThtxDBSK2HPWgS9K06N8syfvotSN0rw-D12BWJrOhr-6vIWHd0iDfWRoiMh8eQ/exec';
const SHEET_ID = '1PTzAlBa7fzncrk1TM80jJFKolvjjiBficXS1fQa-yt4';
const TABS = ['channel_daily','video_daily','blog_daily','project_status','manual_metrics'];

// 유튜브 4채널 — 카드 양식은 전부 YT_FIELDS 하나로 렌더한다 (채널별 분기 없음)
const YT = [
  { id: 'UCmvGKGm4f1Fv4FSa_dREtJg', name: '지잡대TV',     handle: '@지잡대TV',          mm: 'jijabdae' },
  { id: 'UCvjWoQLgLysfLDW-KUdYl3w', name: '스토리스피커', handle: '@storyspeaker_kr',   mm: 'storyspeaker' },
  { id: 'UCrIurwPHzIsbq3I2ymFa46w', name: '새벽바다',     handle: '@PearlineMae',       mm: 'saebyeokbada' },
  { id: 'UC3eTpLaL2U0cQeu1BVmDwwg', name: 'Music Atlas',  handle: '@MusicAtlasOfficial', mm: 'music_atlas' }
];
const link = (name, url) => '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(name) + '</a>';
const ytLink = ch => link(ch.name, 'https://www.youtube.com/channel/' + ch.id);
const NA = '데이터 없음';
const M28_VIEWS = '최근 28일 조회수', M28_HOURS = '최근 28일 시청 시간(시간)';
const M_MONTHLY = '월간 시청자(명)', M_KR = '시청자 지역 대한민국(%)', M_48H = '실시간 48시간 조회수';

const isNum = v => v !== '' && v !== null && v !== undefined && typeof v !== 'boolean' && String(v).trim() !== '' && Number.isFinite(Number(v));
const fmt = n => isNum(n) ? Number(n).toLocaleString('ko-KR') : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const provenance = (r, source) => esc(source) + ' · ' + (r ? esc(r.checked_at || r.date || r.updated_at || NA) + ' 기준' : '실측 기록 없음');
const shortDate = value => { const m = String(value || '').match(/^\d{4}-(\d{2})-(\d{2})/); return m ? m[1] + '-' + m[2] : NA; };
const naHtml = () => '<span class="na">' + NA + '</span>';

// ---------- 데이터 통로: GAS 우선 → 실패 시 시트 gviz 폴백 ----------
async function loadFromGas(){
  const r = await fetch(GAS_URL, { redirect:'follow', signal:AbortSignal.timeout(15000) });
  const d = JSON.parse(await r.text());
  if (!r.ok || !d || !TABS.every(tab => Array.isArray(d[tab]))) throw new Error('gas shape');
  return d;
}
function parseGviz(text){
  const m = text.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
  const j = JSON.parse(m[1]);
  const cols = j.table.cols.map(c => c.label);
  return (j.table.rows || []).map(row => {
    const o = {};
    cols.forEach((h, i) => {
      const cell = row.c ? row.c[i] : null;
      if (!cell || cell.v === null || cell.v === undefined) { o[h] = ''; return; }
      let v = cell.v;
      if (typeof v === 'string' && v.startsWith('Date(')) {
        const p = v.slice(5, -1).split(',').map(Number);
        v = p[0] + '-' + String(p[1] + 1).padStart(2, '0') + '-' + String(p[2]).padStart(2, '0');
        if (p[3]) v += ' ' + String(p[3]).padStart(2,'0') + ':' + String(p[4]||0).padStart(2,'0');
      }
      o[h] = v;
    });
    return o;
  }).filter(o => Object.values(o).some(v => v !== ''));
}
async function loadFromSheet(){
  const out = { generated_at: '' };
  for (const tab of TABS) {
    const r = await fetch('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + tab, {signal:AbortSignal.timeout(15000)});
    if (!r.ok) throw new Error('sheet response');
    out[tab] = parseGviz(await r.text());
  }
  return out;
}

// ---------- 집계 도우미 ----------
function latestBy(rows, key){
  const map = {};
  rows.forEach(r => { if (r[key] !== '' && (!map[r[key]] || String(r.date) >= String(map[r[key]].date))) map[r[key]] = r; });
  return map;
}
function manualMap(rows){
  const map = {};
  rows.forEach(r => {
    if (!r.project_id || !r.metric) return;
    map[r.project_id] = map[r.project_id] || {};
    const cur = map[r.project_id][r.metric];
    if (!cur || String(r.date) >= String(cur.date)) map[r.project_id][r.metric] = r;
  });
  return map;
}
const mrow = (mm, proj, metric) => (mm[proj] && mm[proj][metric]) || null;
const mdate = (mm, proj, metric) => { const r = mrow(mm, proj, metric); return r ? String(r.checked_at || r.date || '') : ''; };
// Studio가 '9.2만'처럼 만 단위로 보여 준 값은 그 정밀도 그대로 표기한다
function mHtml(r, unit){
  if (!r || !isNum(r.value)) return null;
  const v = Number(r.value);
  if (/만 단위|반올림/.test(String(r.note || '')) && v >= 10000) return (v / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '<small>만' + (unit ? ' ' + unit : '') + '</small>';
  return fmt(v) + (unit ? '<small>' + unit + '</small>' : '');
}

function subsSeries(rows, chId){
  return rows.filter(r => r.channel_id === chId && isNum(r.subscribers))
             .slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));
}
function deltaHtml(series){
  if (series.length < 2) return '';
  const d = Number(series[series.length-1].subscribers) - Number(series[series.length-2].subscribers);
  if (d > 0) return '<span class="delta up">▲' + d + '</span>';
  if (d < 0) return '<span class="delta down">▼' + Math.abs(d) + '</span>';
  return '<span class="delta flat">±0</span>';
}
function sparkHtml(series){
  const rs = series.slice(-30);
  if (rs.length < 2) return '<div class="spark-box empty">' + NA + ' · 실측 ' + rs.length + '회 (2회부터 표시)</div>';
  const vals = rs.map(r => Number(r.subscribers));
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const W = 300, H = 46, P = 5;
  const xy = vals.map((v, i) => [P + (W - 2*P) * i / (vals.length - 1), H - P - (H - 2*P) * (v - min) / span]);
  const pts = xy.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const last = xy[xy.length - 1];
  return '<svg class="sparkline" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<polyline points="' + pts + '" fill="none" stroke="#c4ed91" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="#c4ed91"/></svg>';
}
// 최신 스냅샷 기준: 조회수 실측 영상은 조회수 순, 조회수 없는 영상은 최근 게시순, 빈 자리는 미수집 슬롯
function top3Rows(videos, chId){
  const own = videos.filter(v => v.channel_id === chId);
  const dates = [...new Set(own.map(v => String(v.date)))].sort();
  if (!dates.length) return { date: '', rows: [null, null, null] };
  const latest = dates[dates.length - 1];
  const snap = own.filter(v => String(v.date) === latest);
  const withViews = snap.filter(v => isNum(v.views)).sort((a, b) => Number(b.views) - Number(a.views));
  const noViews = snap.filter(v => !isNum(v.views)).sort((a, b) => String(b.published_at).localeCompare(String(a.published_at)));
  const rows = withViews.concat(noViews).slice(0, 3);
  while (rows.length < 3) rows.push(null);
  return { date: latest, rows };
}

// 채널 최신 스냅샷의 조회수 실측 영상 전체 (조회수 내림차순)
function channelVideos(videos, chId){
  const t = videos.filter(v => v.channel_id === chId);
  const dt = t.map(v => String(v.date)).sort().pop();
  return t.filter(v => String(v.date) === dt).sort((a,b) => (isNum(b.views) ? Number(b.views) : -1) - (isNum(a.views) ? Number(a.views) : -1));
}

// ---------- 카드 부품 ----------
const valOrNA = html => html === null || html === undefined ? naHtml() : html;
const isoDay = v => { const m = String(v || '').match(/^\d{4}-\d{2}-\d{2}/); return m ? m[0] : NA; };
const sumBy = (arr, f) => arr.reduce((a, x) => a + Number(f(x)), 0);
// 기준일 범위: 같으면 하나, 다르면 '최소 ~ 최대'
function dateSpan(dates){
  const ds = dates.map(String).filter(s => /^\d{4}-/.test(s)).sort();
  if (!ds.length) return '';
  return ds[0] === ds[ds.length - 1] ? ds[0] : ds[0] + ' ~ ' + ds[ds.length - 1];
}
function hero(label, valueHtml, sub, cls){
  return '<div class="hero' + (cls ? ' ' + cls : '') + '"><div class="k">' + esc(label) + '</div>' +
    '<div class="hv num">' + valOrNA(valueHtml) + '</div><div class="d">' + sub + '</div></div>';
}
function auxBox(label, valueHtml, dateText, source){
  return '<div class="ax" data-field="' + esc(label) + '"><div class="k">' + esc(label) + '</div>' +
    '<div class="av num">' + valOrNA(valueHtml) + '</div>' +
    '<div class="fd">' + (valueHtml === null ? '실측 기록 없음' : esc(dateText) + ' 기준 · ' + esc(source || 'manual_metrics')) + '</div></div>';
}
const fold = (title, meta, inner) =>
  '<details class="fold"><summary><span class="st">' + esc(title) + '</span><span class="fd">' + meta + '</span></summary><div class="fold-b">' + inner + '</div></details>';
// 최근 14회 일별 행 (최신이 위). cols: 행 하나를 [값 html, 보조 html]로 돌려준다
function dayList(series, cols){
  const start = Math.max(0, series.length - 14);
  const rows = [];
  for (let i = series.length - 1; i >= start; i--) {
    const c = cols(series, i);

function ytCard(d, ch, mm){
  const latest = latestBy(d.channel_daily, 'channel_id')[ch.id] || null;
  const series = subsSeries(d.channel_daily, ch.id);
  const subsRow = series.length ? series[series.length - 1] : null;
  const vcRow = d.channel_daily.filter(r => r.channel_id === ch.id && isNum(r.video_count))
                 .sort((a,b) => String(a.date).localeCompare(String(b.date))).pop() || null;
  const v28 = mrow(mm, ch.mm, M28_VIEWS), h28 = mrow(mm, ch.mm, M28_HOURS);
  const mon = mrow(mm, ch.mm, M_MONTHLY), kr = mrow(mm, ch.mm, M_KR), h48 = mrow(mm, ch.mm, M_48H);
  const v28Html = mHtml(v28, '회');

  let h = '<article class="card yt-card" data-ch="' + esc(ch.id) + '">' +
    '<div class="card-h"><h3>' + ytLink(ch) + '</h3><span class="handle">' + esc(ch.handle) + '</span><span class="chip yt ml">YouTube</span></div>' +
    '<div class="heroes">' +
      hero('구독자', subsRow ? fmt(subsRow.subscribers) + '<small>명</small>' + deltaHtml(series) : null,
           subsRow ? esc(subsRow.date) + ' 기준 · ' + esc(subsRow.source || 'channel_daily') : '실측 기록 없음', 'main') +
      hero('최근 28일 조회', v28Html, v28Html === null ? '실측 기록 없음' : esc(mdate(mm, ch.mm, M28_VIEWS)) + ' 기준 · manual_metrics') +
      hero('영상 수', vcRow ? fmt(vcRow.video_count) + '<small>편</small>' : null,
           vcRow ? esc(vcRow.date) + ' 기준 · ' + esc(vcRow.source || 'channel_daily') : '실측 기록 없음') +
    '</div>' +
    '<div class="aux">' +
      auxBox('28일 시청 시간', mHtml(h28, '시간'), mdate(mm, ch.mm, M28_HOURS)) +
      auxBox('월간 시청자', mHtml(mon, '명'), mdate(mm, ch.mm, M_MONTHLY)) +
      auxBox('시청자 한국 비중', kr && isNum(kr.value) ? Number(kr.value) + '<small>%</small>' : null, mdate(mm, ch.mm, M_KR)) +
      auxBox('최근 48시간 조회수', mHtml(h48, '회'), mdate(mm, ch.mm, M_48H)) +
    '</div>';

  // 펼치기 ① 구독자 추이
  h += fold('구독자 추이',
    series.length >= 2 ? '최근 ' + Math.min(series.length, 30) + '회 · channel_daily · ' + esc(series[0].date) + ' ~ ' + esc(series[series.length-1].date) : '실측 ' + series.length + '회',
    sparkHtml(series) + dayList(series, (s, i) => [fmt(s[i].subscribers) + '<small>명</small>', i ? deltaHtml(s.slice(0, i + 1)) : '<span class="fd">직전 실측 없음</span>']));

  // 펼치기 ② 최근 영상 목록 (최신 스냅샷 전체, 최근 게시순, 5개 이후 더 보기)
  const vids = channelVideos(d.video_daily, ch.id).slice().sort((a, b) => String(b.published_at).localeCompare(String(a.published_at)));
  h += fold('최근 영상 목록',
    vids.length ? vids.length + '편 · ' + esc(vids[0].date) + ' · video_daily · 최근 게시순' : '실측 기록 없음',
    vids.length
      ? '<ul class="list">' + vids.slice(0, 5).map(vidRow).join('') + '</ul>' +
        (vids.length > 5 ? '<details class="more"><summary>더 보기 (' + (vids.length - 5) + '편)</summary><ul class="list">' + vids.slice(5).map(vidRow).join('') + '</ul></details>' : '')
      : '<div class="spark-box">' + NA + ' · 영상 실측 기록 없음</div>');

  h += '<div class="src card-src"><span class="k">출처·기준일 </span>' +
       (latest ? esc(latest.source || NA) + ' · 기준일 ' + esc(latest.date) : NA) +
       (v28 || h28 ? ' · 28일 지표 ' + esc((v28 || h28).note || '') : '') + '</div></article>';
  return h;
}

      return '<article class="card proj-card" data-proj="' + esc(p.project_id) + '"><div class="card-h"><h3>' + projectName(p) + '</h3></div>' +
        '<div style="margin-top:10px"><span class="badge' + w + '"><span class="dot' + w + '"></span>' + esc(statusHead(p.status_text) || NA) + '</span></div>' +
        '<div class="desc">' + esc(p.status_text || NA) + '</div>' +
        '<dl class="kv"><dt>마일스톤</dt><dd>' + esc(p.milestone || NA) + '</dd><dt>갱신</dt><dd class="num">' + esc(p.updated_at || NA) + '</dd><dt>출처</dt><dd>' + esc(p.source_file || 'project_status') + '</dd></dl></article>';
    }).join('') + '</div>'
    : '<div class="card"><span class="na">' + NA + '</span> · 프로젝트 상태 기록 없음</div>');

  h += '<footer class="foot">모든 숫자는 시트 실측 기록입니다. 빈 지표는 ' + NA + '으로 표시합니다. 각 지표의 기준일을 확인해 주세요. 구독자 증감은 직전 실측 대비입니다.</footer>';

  document.getElementById('app').innerHTML = h;
}

(async () => {
  const el = document.getElementById('err');
  let d = null;
  try { d = await loadFromGas(); } catch (e) { /* 시트 직접 통로로 폴백 */ }
  if (!d) {
    try { d = await loadFromSheet(); }
    catch (e) {
      el.className = 'fail';
      el.textContent = '지표를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
      document.getElementById('updTime').textContent = NA;
      render(Object.fromEntries(TABS.map(tab => [tab, []])));
      return;
    }
    el.className = 'fallback';
    el.textContent = 'GAS 연결에 실패해 구글시트 직접 읽기로 표시 중입니다.';
  }
  render(d);
})();
</script>
</body>
