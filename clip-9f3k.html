<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipboard Reader</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 24px; }
  button { font-size: 22px; padding: 16px 28px; }
  pre { font-size: 20px; white-space: pre-wrap; word-break: break-all; background: #222; padding: 16px; margin-top: 20px; }
</style>
</head>
<body>
<h1>Clipboard Reader</h1>
<p>Click the button, then allow clipboard access if the browser asks. The clipboard text appears below. Nothing is sent anywhere.</p>
<button id="btn">Read clipboard</button>
<pre id="out">(nothing yet)</pre>
<script>
document.getElementById('btn').addEventListener('click', async () => {
  const out = document.getElementById('out');
  try {
    const t = await navigator.clipboard.readText();
    out.textContent = 'CLIPBOARD_TEXT_BEGIN\n' + t + '\nCLIPBOARD_TEXT_END';
  } catch (e) {
    out.textContent = 'ERROR: ' + e.name + ': ' + e.message;
  }
});
</script>
</body>
</html>
