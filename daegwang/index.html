  const list = document.getElementById('productList');
  function cardHTML(p) {
    return `
      <article class="card">
        <div class="thumb"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
        <div class="info">
          <span class="video-tag">${p.tag}</span>
          <h2 class="name">${p.name}</h2>
          <p class="price">${p.price}</p>
          <div class="buy">${p.link
            ? `<a href="${p.link}" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a>`
            : `<span class="pending">쿠팡 링크 준비 중</span>`}</div>
        </div>
      </article>`;
  }
  function render(tab) {
    const items = tab === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.tab === tab);
    list.innerHTML = items.length ? items.map(cardHTML).join('') : '<p class="empty">아직 등록된 상품이 없어요.</p>';
  }
  document.getElementById('tabBar').addEventListener('click', e => {
    const btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    document.querySelectorAll('#tabBar button').forEach(b => b.classList.toggle('active', b === btn));
    render(btn.dataset.tab);
  });
  render('all');
</script>
